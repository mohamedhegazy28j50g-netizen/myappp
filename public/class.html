<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تفاصيل الكورس | منصة الأستاذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<style>
  /* ============ خاص بالصفحة دي بس ============ */
  .wrap { max-width: 980px; }

  /* ============ CLASS HEADER ============ */
  .class-header {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 24px;
    align-items: center;
    padding: 26px 0 34px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 30px;
  }

  @media (max-width: 640px) { .class-header { flex-direction: column; align-items: flex-start; } }

  .class-thumb-lg {
    width: 120px;
    height: 120px;
    flex-shrink: 0;
    border-radius: var(--radius);
    background:
      radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 60%),
      var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .class-thumb-lg img { width: 100%; height: 100%; object-fit: cover; }

  .class-thumb-lg .fallback {
    width: 54px; height: 54px; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px;
  }

  .class-header h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .class-header p { color: var(--text-dim); font-size: 14.5px; line-height: 1.8; max-width: 560px; }

  .class-meta-row { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; font-size: 13.5px; color: var(--text-dim); }
  .class-meta-row span { display: flex; align-items: center; gap: 6px; }

  /* ============ SEARCH BAR ============ */
  .lessons-toolbar {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }

  .search-box { position: relative; flex: 1; }

  .search-box input {
    width: 100%;
    padding: 13px 44px 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-dim); }

  .search-box .icon {
    position: absolute;
    inset-inline-end: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 15px;
    pointer-events: none;
  }

  .lessons-count { font-size: 13.5px; color: var(--text-dim); white-space: nowrap; }

  /* ============ LESSONS LIST ============ */
  .lessons-list {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 100px;
  }

  .lesson-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }

  .lesson-row:hover {
    border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    transform: translateX(-2px);
    box-shadow: 0 10px 30px -18px color-mix(in srgb, var(--accent) 55%, transparent);
  }

  html[dir="rtl"] .lesson-row:hover { transform: translateX(2px); }

  .lesson-order {
    width: 38px; height: 38px;
    flex-shrink: 0;
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 14px;
  }

  .lesson-info { flex: 1; min-width: 0; }
  .lesson-info h4 { font-size: 15.5px; font-weight: 700; margin-bottom: 4px; }
  .lesson-info .lesson-sub { font-size: 13px; color: var(--text-dim); }

  .lesson-arrow {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .lesson-row:hover .lesson-arrow { background: var(--accent); color: var(--accent-ink); }

  /* ============ حالة الخطأ (مفيش fallback وهمي دلوقتي) ============ */
  .error-state {
    text-align: center; padding: 60px 20px; color: var(--text-dim);
  }
  .error-state .icon {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px;
    background: color-mix(in srgb, var(--live, #E14F4F) 16%, transparent);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .error-state .retry-btn {
    margin-top: 14px; padding: 10px 20px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-weight: 700; font-size: 13.5px; cursor: pointer;
  }
  .error-state .retry-btn:hover { border-color: var(--text-dim); }

  /* ============ زرار الاشتراك في الكورس ============ */
  .subscribe-btn {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 100px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    overflow: visible;
    transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  /* الزرار جنب المحتوى، متمركز رأسيًا مع الهيدر، مش تحت الوصف */
  .class-header > .subscribe-btn {
    margin-inline-start: auto;
    align-self: center;
  }

  @media (max-width: 640px) {
    .class-header > .subscribe-btn { margin-inline-start: 0; margin-top: 4px; }
  }

  .subscribe-btn:disabled { opacity: 0.6; cursor: default; }

  .subscribe-btn.subscribed {
    background: var(--free);
    color: #fff;
  }

  .subscribe-btn.subscribed:hover:not(:disabled) {
    background: color-mix(in srgb, var(--live) 85%, var(--free));
  }

  .subscribe-btn .icon { width: 16px; height: 16px; flex-shrink: 0; }

  .subscribe-btn.pop { animation: subscribePop 0.42s ease; }

  @keyframes subscribePop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.16); }
    60%  { transform: scale(0.94); }
    100% { transform: scale(1); }
  }

  /* ============ تأثير الفرقعة عند الاشتراك ============ */
  .subscribe-burst {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
  }

  .burst-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: burstOut 0.65s ease-out forwards;
  }

  @keyframes burstOut {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
  }

  /* ============ مودال تأكيد إلغاء الاشتراك ============ */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: color-mix(in srgb, var(--bg) 60%, transparent);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .confirm-overlay.open { opacity: 1; pointer-events: auto; }

  .confirm-modal {
    width: min(360px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px 24px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    transform: scale(0.94) translateY(6px);
    transition: transform 0.2s ease;
  }

  .confirm-overlay.open .confirm-modal { transform: scale(1) translateY(0); }

  .confirm-modal .icon {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: color-mix(in srgb, var(--live) 16%, transparent);
    color: var(--live);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    margin-bottom: 14px;
  }

  .confirm-modal h3 { font-size: 16.5px; font-weight: 800; margin-bottom: 8px; }
  .confirm-modal p { font-size: 13.5px; color: var(--text-dim); line-height: 1.8; margin-bottom: 20px; }

  .confirm-actions { display: flex; gap: 10px; }

  .confirm-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
  }

  .confirm-cancel { background: var(--surface); color: var(--text); }
  .confirm-cancel:hover { border-color: var(--text-dim); }

  .confirm-danger { background: var(--live); color: #fff; border-color: var(--live); }
  .confirm-danger:hover { background: color-mix(in srgb, var(--live) 85%, black); }
</style>
</head>
<body>

  <div class="bg-decor"><div class="glow"></div></div>

  <nav>
    <div class="brand">
      <a href="home.html" class="brand-logo"><span class="logo-fy">fy</span><span class="logo-edu">Edu</span></a>
    </div>
    <div class="nav-links">
      <a href="home.html" data-i18n="navHome">الرئيسية</a>
      <a href="classes.html" class="active" data-i18n="navClasses">الكورسات</a>
      <a href="about.html" data-i18n="navAbout">من أنا</a>
      <a href="contact.html" data-i18n="navContact">تواصل</a>
    </div>

    <div class="nav-right">
      <button class="icon-btn" id="langToggle" title="تغيير اللغة">EN</button>
      <button class="icon-btn" id="themeToggle" title="تبديل الوضع">🌙</button>
      <a href="home.html" class="btn-cta" data-i18n="navCta">سجّل دخول</a>
    </div>
  </nav>

  <div class="wrap">

    <!-- المسار: بيوضح "هو فين" دايمًا -->
    <div class="breadcrumb" id="breadcrumb">
      <a href="home.html" data-i18n="crumbHome">الرئيسية</a>
      <span class="sep">/</span>
      <a href="classes.html" data-i18n="crumbClasses">الكورسات</a>
      <span class="sep">/</span>
      <span class="current" id="crumbCurrent">...</span>
    </div>

    <!-- زرار رجوع صريح لصفحة الكورسات -->
    <button class="back-btn" onclick="location.href='classes.html'">
      <span>→</span>
      <span data-i18n="backToClasses">رجوع لكل الكورسات</span>
    </button>

    <header class="class-header" id="classHeader">
      <div class="class-thumb-lg skeleton" id="classThumb"></div>
      <div style="flex:1;">
        <div class="skeleton" style="height:26px;width:50%;border-radius:6px;margin-bottom:10px;"></div>
        <div class="skeleton" style="height:14px;width:80%;border-radius:6px;"></div>
      </div>
    </header>

    <div class="lessons-toolbar">
      <div class="search-box">
        <input type="text" id="lessonSearch" placeholder="ابحث عن درس..." data-i18n-placeholder="searchPlaceholder" />
        <span class="icon">🔍</span>
      </div>
      <span class="lessons-count" id="lessonsCount"></span>
    </div>

    <div class="lessons-list" id="lessonsList">
      <!-- سكيلتون مبدئي -->
    </div>

  </div>

  <!-- مودال تأكيد إلغاء الاشتراك -->
  <div class="confirm-overlay" id="unsubConfirmOverlay">
    <div class="confirm-modal">
      <div class="icon">🔕</div>
      <h3 id="unsubTitle"></h3>
      <p id="unsubBody"></p>
      <div class="confirm-actions">
        <button class="confirm-cancel" id="unsubCancelBtn"></button>
        <button class="confirm-danger" id="unsubConfirmBtn"></button>
      </div>
    </div>
  </div>

  <script src="shared/app.js"></script>
  <script>
    /* ============ ترجمة الصفحة دي ============ */
    const translations = {
      ar: {
        brandName: "اسم الأستاذ", navCta: "سجّل دخول",
        crumbHome: "الرئيسية", crumbClasses: "الكورسات",
        backToClasses: "رجوع لكل الكورسات",
        searchPlaceholder: "ابحث عن درس...",
        lessonsFound: (n) => `${n} درس`,
        emptyTitle: "مفيش دروس تطابق بحثك",
        emptyBody: "جرّب كلمة تانية أو امسح البحث.",
        emptyClassTitle: "الكورس ده لسه من غير دروس",
        classErrorTitle: "معرفناش نجيب بيانات الكورس",
        lessonsErrorTitle: "معرفناش نجيب الدروس",
        errorBody: "تأكد إن السيرفر شغال، أو جرّب تاني.",
        retry: "إعادة المحاولة",
        subscribeLabel: "اشترك في الكورس",
        subscribedLabel: "مشترك ✓",
        subscribeErrorLoggedOut: "سجّل دخول الأول عشان تشترك",
        unsubTitle: "تلغي الاشتراك في الكورس؟",
        unsubBody: "هتوقف تستقبل إشعارات عن الدروس والتحديثات الجديدة في هذا الكورس.",
        unsubConfirm: "إلغاء الاشتراك",
        unsubCancel: "تراجع",
      },
      en: {
        brandName: "Teacher Name", navCta: "Log In",
        crumbHome: "Home", crumbClasses: "Courses",
        backToClasses: "Back to all courses",
        searchPlaceholder: "Search lessons...",
        lessonsFound: (n) => `${n} lessons`,
        emptyTitle: "No lessons match your search",
        emptyBody: "Try a different word or clear the search.",
        emptyClassTitle: "This course has no lessons yet",
        classErrorTitle: "Couldn't load the course",
        lessonsErrorTitle: "Couldn't load the lessons",
        errorBody: "Make sure the server is running, or try again.",
        retry: "Retry",
        subscribeLabel: "Subscribe to course",
        subscribedLabel: "Subscribed ✓",
        subscribeErrorLoggedOut: "Log in first to subscribe",
        unsubTitle: "Unsubscribe from this course?",
        unsubBody: "You'll stop receiving notifications about new lessons and updates for this course.",
        unsubConfirm: "Unsubscribe",
        unsubCancel: "Cancel",
      },
    };

    /* ============ قراءة id الكلاس من الرابط ============ */
    const params = new URLSearchParams(location.search);
    const classId = params.get("id");

    let allLessons = [];
    let currentQuery = "";
    let i18n;

    // initI18n بتنده الـ callback بتاعتها *قبل* ما ترجع وتتحط في i18n،
    // فوقت أول نداء للـ callback يبقى i18n لسه undefined. الدالة دي
    // بتتفادى المشكلة دي بقراءة اللغة من localStorage كـ fallback.
    function getLang() {
      if (i18n && typeof i18n.getLang === "function") return i18n.getLang();
      return localStorage.getItem("lang") || "ar";
    }

    function authHeaders() {
      const token = localStorage.getItem("token");
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    /* ============ اشتراك في الكورس ============ */
    const subscribeIcons = {
      plus: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
      check: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    };

    let isSubscribed = false;
    let subscriptionKnown = false;

    function renderSubscribeBtn() {
      const btn = document.getElementById("subscribeBtn");
      if (!btn) return;
      const t = translations[getLang()];
      btn.disabled = false;
      btn.classList.toggle("subscribed", isSubscribed);
      btn.innerHTML = isSubscribed
        ? `${subscribeIcons.check}<span>${t.subscribedLabel}</span>`
        : `${subscribeIcons.plus}<span>${t.subscribeLabel}</span>`;
    }

    async function loadSubscriptionStatus() {
      if (!classId) return;
      try {
        const res = await fetch(`/subscriptions/check/${classId}`, { headers: authHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        isSubscribed = !!data.subscribed;
        subscriptionKnown = true;
        renderSubscribeBtn();
      } catch (err) {
        console.error("loadSubscriptionStatus error:", err);
        // لو فشل الطلب (مثلاً 401 لمستخدم مش مسجّل دخول) سيب الزرار
        // في وضعه الافتراضي "اشترك" — هيتصرف صح لما يدوس عليه
      }
    }

    // ============ تأثير الفرقعة عند الاشتراك (زي زرار يوتيوب) ============
    function burstEffect(btn) {
      const rect = btn.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const wrap = document.createElement("span");
      wrap.className = "subscribe-burst";

      const count = 14;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.35;
        const dist = 24 + Math.random() * 20;
        const dot = document.createElement("span");
        dot.className = "burst-dot";
        dot.style.left = `${cx}px`;
        dot.style.top = `${cy}px`;
        dot.style.setProperty("--tx", `${Math.cos(angle) * dist}px`);
        dot.style.setProperty("--ty", `${Math.sin(angle) * dist}px`);
        dot.style.background = i % 2 === 0 ? "var(--free)" : "var(--accent)";
        wrap.appendChild(dot);
      }

      btn.appendChild(wrap);
      setTimeout(() => wrap.remove(), 700);
    }

    // ============ مودال تأكيد إلغاء الاشتراك ============
    function openUnsubConfirm() {
      document.getElementById("unsubConfirmOverlay").classList.add("open");
    }

    function closeUnsubConfirm() {
      document.getElementById("unsubConfirmOverlay").classList.remove("open");
    }

    async function toggleSubscribe() {
      const btn = document.getElementById("subscribeBtn");
      if (!classId || !btn || btn.disabled) return;

      // لو مشترك بالفعل، اسأله الأول قبل ما تشيل الاشتراك
      if (isSubscribed) {
        openUnsubConfirm();
        return;
      }

      await doSubscribe();
    }

    async function doSubscribe() {
      const btn = document.getElementById("subscribeBtn");
      if (!btn) return;
      btn.disabled = true;

      try {
        const res = await fetch(`/subscriptions/${classId}`, {
          method: "POST",
          headers: authHeaders(),
        });

        if (res.status === 401) {
          alert(translations[getLang()].subscribeErrorLoggedOut);
          btn.disabled = false;
          return;
        }

        // 409 (مشترك بالفعل) بنتعامل معاه كنجاح عشان الحالة تتزبط
        if (!res.ok && res.status !== 409) throw new Error(`HTTP ${res.status}`);

        isSubscribed = true;
        renderSubscribeBtn();

        const freshBtn = document.getElementById("subscribeBtn");
        burstEffect(freshBtn);
        freshBtn.classList.add("pop");
        setTimeout(() => freshBtn.classList.remove("pop"), 420);
      } catch (err) {
        console.error("subscribe error:", err);
        btn.disabled = false;
      }
    }

    async function doUnsubscribe() {
      closeUnsubConfirm();
      const btn = document.getElementById("subscribeBtn");
      if (!btn) return;
      btn.disabled = true;

      try {
        const res = await fetch(`/subscriptions/${classId}`, {
          method: "DELETE",
          headers: authHeaders(),
        });

        if (res.status === 401) {
          alert(translations[getLang()].subscribeErrorLoggedOut);
          btn.disabled = false;
          return;
        }

        // 404 (مش مشترك أساسًا) بنتعامل معاه كنجاح عشان الحالة تتزبط
        if (!res.ok && res.status !== 404) throw new Error(`HTTP ${res.status}`);

        isSubscribed = false;
        renderSubscribeBtn();
      } catch (err) {
        console.error("unsubscribe error:", err);
        btn.disabled = false;
      }
    }

    /* ============ بيانات الكورس — من الباك اند فقط، من غير أي fallback وهمي ============ */
    async function loadClass() {
      if (!classId) {
        renderClassError();
        return;
      }
      try {
        const res = await fetch(`/classes/${classId}`, { headers: authHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        paintClassHeader(data.class);
      } catch (err) {
        console.error("loadClass error:", err);
        renderClassError();
      }
    }

    function renderClassError() {
      const t = translations[getLang()];
      document.getElementById("classHeader").innerHTML = `
        <div class="error-state" style="width:100%;">
          <div class="icon">⚠️</div>
          <h3 style="color:var(--text);margin-bottom:6px;">${t.classErrorTitle}</h3>
          <p>${t.errorBody}</p>
          <button class="retry-btn" onclick="loadClass()">${t.retry}</button>
        </div>
      `;
    }

    function paintClassHeader(cls) {
      document.getElementById("crumbCurrent").textContent = cls.title;
      document.title = `${cls.title} | منصة الأستاذ`;

      document.getElementById("classHeader").innerHTML = `
        <div class="class-thumb-lg" id="classThumb">
          ${cls.thumbnail
            ? `<img src="${cls.thumbnail}" alt="${cls.title}" />`
            : `<div class="fallback">${(cls.title || "?").trim().charAt(0)}</div>`}
        </div>
        <div style="flex:1;">
          <h1>${cls.title}</h1>
          <p>${cls.description || ""}</p>
          <div class="class-meta-row">
            <span id="metaLessonsCount">📖 —</span>
          </div>
        </div>
        <button class="subscribe-btn" id="subscribeBtn" disabled>
          ${subscribeIcons.plus}<span>${translations[getLang()].subscribeLabel}</span>
        </button>
      `;

      document.getElementById("subscribeBtn").addEventListener("click", toggleSubscribe);

      if (subscriptionKnown) {
        renderSubscribeBtn();
      } else {
        loadSubscriptionStatus();
      }

      // لو الدروس اتحملت قبل بيانات الكورس، حدّث العداد فورًا
      if (allLessons.length) updateLessonsMeta();
    }

    function updateLessonsMeta() {
      const metaEl = document.getElementById("metaLessonsCount");
      if (metaEl) metaEl.textContent = `📖 ${allLessons.length} ${getLang() === "ar" ? "درس" : "lessons"}`;
    }

    /* ============ الدروس — من الباك اند فقط ============ */
    async function loadLessons() {
      if (!classId) {
        renderLessonsError();
        return;
      }
      try {
        const res = await fetch(`/classes/${classId}/lessons`, { headers: authHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allLessons = data.lessons || [];
        updateLessonsMeta();
        renderLessons(currentQuery);
      } catch (err) {
        console.error("loadLessons error:", err);
        renderLessonsError();
      }
    }

    function renderLessonsError() {
      const t = translations[getLang()];
      document.getElementById("lessonsList").innerHTML = `
        <div class="error-state">
          <div class="icon">⚠️</div>
          <h3 style="color:var(--text);margin-bottom:6px;">${t.lessonsErrorTitle}</h3>
          <p>${t.errorBody}</p>
          <button class="retry-btn" onclick="loadLessons()">${t.retry}</button>
        </div>
      `;
      document.getElementById("lessonsCount").textContent = "";
    }

    function renderLessonsCount() {
      const el = document.getElementById("lessonsCount");
      const filtered = filterLessons(currentQuery);
      el.textContent = translations[getLang()].lessonsFound(filtered.length);
    }

    function filterLessons(query) {
      if (!query.trim()) return allLessons;
      const q = query.trim().toLowerCase();
      return allLessons.filter((l) => l.title.toLowerCase().includes(q));
    }

    function lessonRowTemplate(lesson) {
      return `
        <a class="lesson-row" href="lesson.html?id=${lesson._id}">
          <div class="lesson-order">${lesson.order}</div>
          <div class="lesson-info">
            <h4>${lesson.title}</h4>
            <span class="lesson-sub">${getLang() === "ar" ? "اضغط لعرض حصص الدرس" : "Tap to view sessions"}</span>
          </div>
          <div class="lesson-arrow">←</div>
        </a>
      `;
    }

    function renderLessons(query) {
      const list = document.getElementById("lessonsList");
      const filtered = filterLessons(query);
      renderLessonsCount();

      if (!allLessons.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <h3 style="color:var(--text);margin-bottom:8px;">${translations[getLang()].emptyClassTitle}</h3>
          </div>`;
        return;
      }

      if (!filtered.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <h3 style="color:var(--text);margin-bottom:8px;">${translations[getLang()].emptyTitle}</h3>
            <p>${translations[getLang()].emptyBody}</p>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(lessonRowTemplate).join("");
    }

    function skeletonRows(n = 5) {
      const list = document.getElementById("lessonsList");
      list.innerHTML = Array.from({ length: n }).map(() => `
        <div class="lesson-row">
          <div class="skeleton" style="width:38px;height:38px;border-radius:10px;"></div>
          <div style="flex:1;">
            <div class="skeleton" style="height:15px;width:40%;border-radius:6px;margin-bottom:6px;"></div>
            <div class="skeleton" style="height:12px;width:25%;border-radius:6px;"></div>
          </div>
        </div>
      `).join("");
    }

    /* ============ شريط البحث — فلترة لحظية على الدروس اللي اتحملت ============ */
    document.getElementById("lessonSearch").addEventListener("input", (e) => {
      currentQuery = e.target.value;
      renderLessons(currentQuery);
    });

    /* ============ مودال تأكيد إلغاء الاشتراك — نصوصه وأزراره ============ */
    function renderUnsubModalText() {
      const t = translations[getLang()];
      document.getElementById("unsubTitle").textContent = t.unsubTitle;
      document.getElementById("unsubBody").textContent = t.unsubBody;
      document.getElementById("unsubCancelBtn").textContent = t.unsubCancel;
      document.getElementById("unsubConfirmBtn").textContent = t.unsubConfirm;
    }

    document.getElementById("unsubCancelBtn").addEventListener("click", closeUnsubConfirm);
    document.getElementById("unsubConfirmBtn").addEventListener("click", doUnsubscribe);

    document.getElementById("unsubConfirmOverlay").addEventListener("click", (e) => {
      if (e.target.id === "unsubConfirmOverlay") closeUnsubConfirm();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeUnsubConfirm();
    });

    renderUnsubModalText();

    i18n = initI18n(translations, () => {
      renderLessonsCount();
      renderLessons(currentQuery);
      if (subscriptionKnown) renderSubscribeBtn();
      renderUnsubModalText();
    });

    skeletonRows();
    loadClass();
    loadLessons();
  </script>

</body>
</html>
