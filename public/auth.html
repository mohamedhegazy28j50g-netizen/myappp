<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | منصة الأستاذ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- ملف الـCSS المشترك الموجود عندك -->
  <link rel="stylesheet" href="shared/style.css">

  <style>
    .auth-page {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px 90px;
      position: relative;
      z-index: 1;
    }

    .auth-wrap {
      width: min(100%, 470px);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-header h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .auth-header h1 span { color: var(--accent); }

    .auth-header p {
      color: var(--text-dim);
      line-height: 1.8;
      font-size: 14px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.10);
    }

    html[data-theme="dark"] .auth-card {
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }

    .auth-view { display: none; }
    .auth-view.active { display: block; }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
    }

    .password-row {
      position: relative;
    }

    .password-row input {
      padding-left: 48px;
    }

    .show-password {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      padding: 7px;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, opacity .2s;
      margin-top: 3px;
    }

    .primary-btn:hover { transform: translateY(-1px); }
    .primary-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .auth-links {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
      font-size: 13px;
    }

    .auth-links button {
      border: 0;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 0;
    }

    .auth-message {
      display: none;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .auth-message.show { display: block; }

    .auth-message.success {
      background: color-mix(in srgb, var(--free) 12%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--free) 35%, var(--border));
      color: var(--text);
    }

    .auth-message.error {
      background: color-mix(in srgb, #e14f4f 10%, var(--surface));
      border: 1px solid color-mix(in srgb, #e14f4f 35%, var(--border));
      color: var(--text);
    }

    .code-input {
      direction: ltr;
      text-align: center;
      letter-spacing: 8px;
      font-size: 22px !important;
      font-weight: 800;
    }

    .step-note {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.8;
      margin-bottom: 16px;
    }

    .back-btn {
      border: 0;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .back-btn:hover { color: var(--text); }

    .auth-brand {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .auth-brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: var(--accent);
      color: var(--accent-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
    }

    .resend-row {
      text-align: center;
      margin-top: 14px;
      color: var(--text-dim);
      font-size: 13px;
    }

    .resend-row button {
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 560px) {
      .auth-page { padding-top: 30px; }
      .auth-card { padding: 21px; }
      .auth-header h1 { font-size: 27px; }
    }
  </style>
</head>

<body>
  <div class="bg-decor">
    <div class="glow"></div>
  </div>

  <nav>
    <div class="brand">
      <span class="brand-mark">أ</span>
      <span>منصة الأستاذ</span>
    </div>

    <div class="nav-links">
      <a href="home.html">الرئيسية</a>
      <a href="classes.html">الكورسات</a>
      <a href="about.html">من أنا</a>
      <a href="contact.html">تواصل</a>
    </div>

    <div class="nav-right">
      <button class="icon-btn" id="langToggle" title="تغيير اللغة">EN</button>
      <button class="icon-btn" id="themeToggle" title="تبديل الوضع">🌙</button>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-wrap">

      <div class="auth-header">
        <div class="auth-brand">
          <div class="auth-brand-mark">أ</div>
        </div>
        <h1 id="authTitle">أهلاً بك <span>مرة أخرى</span></h1>
        <p id="authSubtitle">سجّل دخولك للوصول إلى حسابك وكورساتك.</p>
      </div>

      <div class="auth-card">

        <div id="message" class="auth-message"></div>

        <!-- LOGIN -->
        <section id="loginView" class="auth-view active">
          <form id="loginForm" class="auth-form">
            <div class="field">
              <label for="loginEmail">البريد الإلكتروني</label>
              <input id="loginEmail" type="email" autocomplete="email" required>
            </div>

            <div class="field">
              <label for="loginPassword">كلمة المرور</label>
              <div class="password-row">
                <input id="loginPassword" type="password" autocomplete="current-password" required>
                <button type="button" class="show-password" data-target="loginPassword">👁</button>
              </div>
            </div>

            <button class="primary-btn" type="submit">تسجيل الدخول</button>
          </form>

          <div class="auth-links">
            <button type="button" data-show="registerView">إنشاء حساب جديد</button>
            <button type="button" data-show="forgotView">نسيت كلمة المرور؟</button>
          </div>
        </section>

        <!-- REGISTER -->
        <section id="registerView" class="auth-view">
          <button class="back-btn" type="button" data-show="loginView">← العودة لتسجيل الدخول</button>

          <form id="registerForm" class="auth-form">
            <div class="field">
              <label for="registerName">الاسم</label>
              <input id="registerName" type="text" autocomplete="name" required>
            </div>

            <div class="field">
              <label for="registerEmail">البريد الإلكتروني</label>
              <input id="registerEmail" type="email" autocomplete="email" required>
            </div>

            <div class="field">
              <label for="registerPassword">كلمة المرور</label>
              <div class="password-row">
                <input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required>
                <button type="button" class="show-password" data-target="registerPassword">👁</button>
              </div>
            </div>

            <div class="field">
              <label for="registerPasswordConfirm">تأكيد كلمة المرور</label>
              <div class="password-row">
                <input id="registerPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required>
                <button type="button" class="show-password" data-target="registerPasswordConfirm">👁</button>
              </div>
            </div>

            <button class="primary-btn" type="submit">إنشاء الحساب</button>
          </form>
        </section>

        <!-- REGISTER VERIFY -->
        <section id="registerVerifyView" class="auth-view">
          <div class="step-note">
            أرسلنا كود تحقق مكوّن من 6 أرقام إلى البريد الإلكتروني:
            <strong id="registerVerifyEmail"></strong>
          </div>

          <form id="registerVerifyForm" class="auth-form">
            <div class="field">
              <label for="registerCode">كود التحقق</label>
              <input id="registerCode" class="code-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
            </div>

            <button class="primary-btn" type="submit">تأكيد البريد الإلكتروني</button>
          </form>

          <div class="resend-row">
            لم يصلك الكود؟
            <button id="resendRegisterCode" type="button">إرسال كود جديد</button>
          </div>
        </section>

        <!-- FORGOT -->
        <section id="forgotView" class="auth-view">
          <button class="back-btn" type="button" data-show="loginView">← العودة لتسجيل الدخول</button>

          <form id="forgotForm" class="auth-form">
            <div class="field">
              <label for="forgotEmail">البريد الإلكتروني</label>
              <input id="forgotEmail" type="email" autocomplete="email" required>
            </div>

            <button class="primary-btn" type="submit">إرسال كود استعادة</button>
          </form>
        </section>

        <!-- RESET VERIFY -->
        <section id="resetVerifyView" class="auth-view">
          <div class="step-note">
            أدخل كود استعادة كلمة المرور الذي وصلك على البريد الإلكتروني:
            <strong id="resetVerifyEmail"></strong>
          </div>

          <form id="resetVerifyForm" class="auth-form">
            <div class="field">
              <label for="resetCode">كود الاستعادة</label>
              <input id="resetCode" class="code-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
            </div>

            <button class="primary-btn" type="submit">تأكيد الكود</button>

                  <div class="resend-row">
                  لم يصلك الكود؟
                 <button id="resendResetCode" type="button">إرسال كود جديد</button>
                  </div>
          </form>
        </section>

        <!-- RESET PASSWORD -->
        <section id="resetPasswordView" class="auth-view">
          <form id="resetPasswordForm" class="auth-form">
            <div class="field">
              <label for="newPassword">كلمة المرور الجديدة</label>
              <div class="password-row">
                <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
                <button type="button" class="show-password" data-target="newPassword">👁</button>
              </div>
            </div>

            <div class="field">
              <label for="newPasswordConfirm">تأكيد كلمة المرور الجديدة</label>
              <div class="password-row">
                <input id="newPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required>
                <button type="button" class="show-password" data-target="newPasswordConfirm">👁</button>
              </div>
            </div>

            <button class="primary-btn" type="submit">تغيير كلمة المرور</button>
          </form>
        </section>

      </div>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
