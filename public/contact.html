<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تواصل معنا | منصة الأستاذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<style>
  .wrap { max-width: 900px; }

  .doodle-c1 { width: 70px; height: 70px; top: 16%; left: 7%; }
  .doodle-c2 { width: 100px; height: 100px; bottom: 8%; right: 6%; }

  .contact-header {
    position: relative;
    z-index: 1;
    padding: 60px 0 40px;
    text-align: center;
  }

  .contact-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 7px 16px;
    border-radius: 100px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .contact-eyebrow-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

  .contact-header h1 { font-size: 36px; font-weight: 800; margin-bottom: 14px; }
  .contact-header h1 span { color: var(--accent); }
  .contact-header p { color: var(--text-dim); font-size: 15px; max-width: 480px; margin: 0 auto; line-height: 1.9; }

  @media (max-width: 560px) { .contact-header h1 { font-size: 27px; } }

  .contact-grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
    padding-bottom: 90px;
  }

  .contact-card {
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .contact-card:hover {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    box-shadow: 0 20px 45px -20px color-mix(in srgb, var(--accent) 45%, transparent);
  }

  .contact-card .c-icon {
    width: 48px; height: 48px;
    border-radius: 13px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
  }

  .contact-card .c-info { min-width: 0; }
  .contact-card .c-label { font-size: 12.5px; color: var(--text-dim); margin-bottom: 3px; }
  .contact-card .c-value {
    font-size: 14.5px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .contact-empty {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 50px 20px 90px;
    color: var(--text-dim);
  }

  .contact-loading { text-align: center; padding: 60px 0; color: var(--text-dim); }
</style>
</head>
<body>

  <div class="bg-decor">
    <div class="glow"></div>
    <svg class="doodle doodle-c1" viewBox="0 0 70 70" fill="none"><rect x="4" y="4" width="62" height="62" rx="14" stroke-width="1.5" stroke-dasharray="6 6"/></svg>
    <svg class="doodle doodle-c2" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="46" stroke-width="1.5" stroke-dasharray="7 7"/></svg>
  </div>

  <nav>
    <div class="brand">
      <a href="home.html" class="brand-logo"><span class="logo-fy">fy</span><span class="logo-edu">Edu</span></a>
    </div>

    <div class="nav-links">
      <a href="home.html" data-i18n="navHome">الرئيسية</a>
      <a href="classes.html" data-i18n="navClasses">الكورسات</a>
      <a href="about.html" data-i18n="navAbout">من أنا</a>
      <a href="contact.html" class="active" data-i18n="navContact">تواصل</a>
    </div>

    <div class="nav-right">
      <button class="icon-btn" id="langToggle" title="تغيير اللغة">EN</button>
      <button class="icon-btn" id="themeToggle" title="تبديل الوضع">🌙</button>
      <a href="auth.html" class="btn-cta" data-i18n="navCta">سجّل دخول</a>
    </div>
  </nav>

  <div class="wrap">
    <header class="contact-header">
      <div class="contact-eyebrow">
        <span class="contact-eyebrow-dot"></span>
        <span data-i18n="contactEyebrow">تحت أمرك</span>
      </div>
      <h1><span data-i18n="contactTitleHighlight">تواصل</span> <span data-i18n="contactTitleRest">معايا</span></h1>
      <p data-i18n="contactLede">لأي استفسار عن الكورسات أو الحصص، تواصل معايا من أي قناة تناسبك.</p>
    </header>

    <div class="contact-grid" id="contactGrid" style="display:none;"></div>
    <div class="contact-empty" id="contactEmpty" style="display:none;" data-i18n="contactEmptyText">لسه مفيش وسائل تواصل مضافة.</div>
    <div class="contact-loading" id="contactLoading" data-i18n="loadingText">بيتحمّل...</div>
  </div>

  <script src="shared/app.js"></script>
  <script>
    const translations = {
      ar: {
        brandName: "اسم الأستاذ", navHome: "الرئيسية", navClasses: "الكورسات",
        navAbout: "من أنا", navContact: "تواصل", navCta: "سجّل دخول",
        contactEyebrow: "تحت أمرك",
        contactTitleHighlight: "تواصل", contactTitleRest: "معايا",
        contactLede: "لأي استفسار عن الكورسات أو الحصص، تواصل معايا من أي قناة تناسبك.",
        contactEmptyText: "لسه مفيش وسائل تواصل مضافة.",
        loadingText: "بيتحمّل...",
        labels: {
          whatsapp: "واتساب", phone: "تليفون", email: "إيميل",
          facebook: "فيسبوك", instagram: "إنستجرام", youtube: "يوتيوب", tiktok: "تيك توك",
        },
      },
      en: {
        brandName: "Teacher Name", navHome: "Home", navClasses: "Courses",
        navAbout: "About", navContact: "Contact", navCta: "Log In",
        contactEyebrow: "At your service",
        contactTitleHighlight: "Get in", contactTitleRest: "Touch",
        contactLede: "For any question about courses or sessions, reach out through whichever channel suits you.",
        contactEmptyText: "No contact channels added yet.",
        loadingText: "Loading...",
        labels: {
          whatsapp: "WhatsApp", phone: "Phone", email: "Email",
          facebook: "Facebook", instagram: "Instagram", youtube: "YouTube", tiktok: "TikTok",
        },
      },
    };

    function getLang() {
      return localStorage.getItem("lang") || "ar";
    }

    const CHANNELS = [
      { key: "whatsapp", icon: "📱", hrefFn: (v) => `https://wa.me/${v.replace(/[^0-9]/g, "")}` },
      { key: "phone", icon: "📞", hrefFn: (v) => `tel:${v}` },
      { key: "email", icon: "✉️", hrefFn: (v) => `mailto:${v}` },
      { key: "facebook", icon: "📘", hrefFn: (v) => v },
      { key: "instagram", icon: "📸", hrefFn: (v) => v },
      { key: "youtube", icon: "▶️", hrefFn: (v) => v },
      { key: "tiktok", icon: "🎵", hrefFn: (v) => v },
    ];

    let settingsData = null;

    function renderContact() {
      const t = translations[getLang()];
      const contact = settingsData?.contact || {};

      const filled = CHANNELS.filter((c) => contact[c.key] && contact[c.key].trim());

      const grid = document.getElementById("contactGrid");
      const empty = document.getElementById("contactEmpty");

      if (!filled.length) {
        grid.style.display = "none";
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";
      grid.style.display = "grid";
      grid.innerHTML = filled.map((c) => `
        <a class="contact-card" href="${c.hrefFn(contact[c.key])}" target="_blank" rel="noopener">
          <div class="c-icon">${c.icon}</div>
          <div class="c-info">
            <div class="c-label">${t.labels[c.key]}</div>
            <div class="c-value">${contact[c.key]}</div>
          </div>
        </a>
      `).join("");
    }

    async function loadSettings() {
      try {
        const res = await fetch("/settings");
        if (!res.ok) throw new Error("bad response");
        const data = await res.json();
        settingsData = data.settings;
      } catch (err) {
        settingsData = { about: {}, contact: {} };
      }
      document.getElementById("contactLoading").style.display = "none";
      renderContact();
    }

    initI18n(translations, () => {
      if (settingsData) renderContact();
    });

    loadSettings();
  </script>

</body>
</html>
