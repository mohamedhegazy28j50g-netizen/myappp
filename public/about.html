<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>من أنا | منصة الأستاذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<style>
  .wrap { max-width: 1080px; }

  .doodle-a1 { width: 80px; height: 80px; top: 14%; left: 6%; }
  .doodle-a2 { width: 50px; height: 50px; top: 60%; left: 10%; }
  .doodle-a3 { width: 100px; height: 100px; bottom: 6%; right: 5%; }

  /* ============ HERO: صورة + نص ============ */
  .about-hero {
    position: relative;
    z-index: 1;
    padding: 60px 0 50px;
  }

  .about-hero-grid {
    display: grid;
    grid-template-columns: 0.8fr 1.2fr;
    gap: 56px;
    align-items: center;
  }

  @media (max-width: 900px) {
    .about-hero-grid { grid-template-columns: 1fr; text-align: center; }
  }

  .about-photo-wrap { position: relative; display: flex; justify-content: center; }

  .about-photo-ring {
    position: relative;
    width: min(300px, 70vw);
    aspect-ratio: 1;
    border-radius: 50%;
    padding: 8px;
    background: conic-gradient(from 220deg, var(--accent), transparent 55%, var(--accent) 100%);
  }

  .about-photo-frame {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: var(--surface);
    border: 4px solid var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .about-photo-frame img { width: 100%; height: 100%; object-fit: cover; }

  .about-photo-frame .avatar-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 800;
    font-size: 64px;
  }

  .about-photo-glow {
    position: absolute;
    inset: -30px;
    z-index: -1;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, transparent) 0%, transparent 70%);
    pointer-events: none;
  }

  .about-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 7px 16px;
    border-radius: 100px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .about-eyebrow-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

  .about-hero h1 { font-size: 38px; font-weight: 800; margin-bottom: 20px; line-height: 1.3; }
  .about-hero h1 span { color: var(--accent); }

  @media (max-width: 560px) { .about-hero h1 { font-size: 28px; } }

  .about-bio {
    color: var(--text-dim);
    font-size: 15.5px;
    line-height: 2.1;
    white-space: pre-line;
  }

  .about-bio p { margin-bottom: 14px; }

  .about-bio-empty { color: var(--text-dim); font-size: 14px; }

  /* ============ الإحصائيات ============ */
  .about-stats-section {
    position: relative;
    z-index: 1;
    padding: 20px 0 90px;
  }

  .about-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
  }

  .about-stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 18px;
    text-align: center;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }

  .about-stat-card:hover {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  }

  .about-stat-card .stat-value {
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .about-stat-card .stat-label {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
  }

  .about-loading { text-align: center; padding: 60px 0; color: var(--text-dim); }
</style>
</head>
<body>

  <div class="bg-decor">
    <div class="glow"></div>
    <svg class="doodle doodle-a1" viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="36" stroke-width="1.5" stroke-dasharray="6 6"/></svg>
    <svg class="doodle doodle-a2" viewBox="0 0 50 50" fill="none"><rect x="3" y="3" width="44" height="44" rx="10" stroke-width="1.5"/></svg>
    <svg class="doodle doodle-a3" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="46" stroke-width="1.5" stroke-dasharray="7 7"/></svg>
  </div>

  <nav>
    <div class="brand">
      <a href="home.html" class="brand-logo"><span class="logo-fy">fy</span><span class="logo-edu">Edu</span></a>
    </div>

    <div class="nav-links">
      <a href="home.html" data-i18n="navHome">الرئيسية</a>
      <a href="classes.html" data-i18n="navClasses">الكورسات</a>
      <a href="about.html" class="active" data-i18n="navAbout">من أنا</a>
      <a href="contact.html" data-i18n="navContact">تواصل</a>
    </div>

    <div class="nav-right">
      <button class="icon-btn" id="langToggle" title="تغيير اللغة">EN</button>
      <button class="icon-btn" id="themeToggle" title="تبديل الوضع">🌙</button>
      <a href="auth.html" class="btn-cta" data-i18n="navCta">سجّل دخول</a>
    </div>
  </nav>

  <div class="wrap" id="aboutContent" style="display:none;">
    <section class="about-hero">
      <div class="about-hero-grid">
        <div class="about-photo-wrap">
          <div class="about-photo-ring">
            <div class="about-photo-glow"></div>
            <div class="about-photo-frame" id="aboutPhotoFrame"></div>
          </div>
        </div>

        <div>
          <div class="about-eyebrow">
            <span class="about-eyebrow-dot"></span>
            <span data-i18n="aboutEyebrow">اتعرّف عليّا أكتر</span>
          </div>
          <h1><span data-i18n="aboutTitleHighlight">من</span> <span data-i18n="aboutTitleRest">أنا</span></h1>
          <div class="about-bio" id="aboutBio"></div>
        </div>
      </div>
    </section>

    <section class="about-stats-section" id="aboutStatsSection" style="display:none;">
      <div class="about-stats-grid" id="aboutStatsGrid"></div>
    </section>
  </div>

  <div class="about-loading" id="aboutLoading" data-i18n="loadingText">بيتحمّل...</div>

  <script src="shared/app.js"></script>
  <script>
    const translations = {
      ar: {
        brandName: "اسم الأستاذ", navHome: "الرئيسية", navClasses: "الكورسات",
        navAbout: "من أنا", navContact: "تواصل", navCta: "سجّل دخول",
        aboutEyebrow: "اتعرّف عليّا أكتر",
        aboutTitleHighlight: "من", aboutTitleRest: "أنا",
        bioEmpty: "لسه مفيش نبذة مضافة.",
        loadingText: "بيتحمّل...",
      },
      en: {
        brandName: "Teacher Name", navHome: "Home", navClasses: "Courses",
        navAbout: "About", navContact: "Contact", navCta: "Log In",
        aboutEyebrow: "Get to know me",
        aboutTitleHighlight: "About", aboutTitleRest: "Me",
        bioEmpty: "No bio added yet.",
        loadingText: "Loading...",
      },
    };

    let settingsData = null;

    function renderAbout() {
      const t = translations[getLang()];
      const about = settingsData?.about || {};

      const photoFrame = document.getElementById("aboutPhotoFrame");
      photoFrame.innerHTML = about.photoUrl
        ? `<img src="${about.photoUrl}" alt="" />`
        : `<div class="avatar-fallback">أ</div>`;

      const bioEl = document.getElementById("aboutBio");
      if (about.bio && about.bio.trim()) {
        bioEl.innerHTML = about.bio
          .split(/\n{2,}/)
          .map((para) => `<p>${para.replace(/\n/g, "<br>")}</p>`)
          .join("");
      } else {
        bioEl.innerHTML = `<p class="about-bio-empty">${t.bioEmpty}</p>`;
      }

      const stats = about.stats || [];
      const statsSection = document.getElementById("aboutStatsSection");
      if (stats.length) {
        statsSection.style.display = "block";
        document.getElementById("aboutStatsGrid").innerHTML = stats.map((s) => `
          <div class="about-stat-card">
            <div class="stat-value">${s.value}</div>
            <div class="stat-label">${s.label}</div>
          </div>
        `).join("");
      } else {
        statsSection.style.display = "none";
      }
    }

    async function loadSettings() {
      try {
        const res = await fetch("/settings");
        if (!res.ok) throw new Error("bad response");
        const data = await res.json();
        settingsData = data.settings;
      } catch (err) {
        settingsData = { about: {}, contact: {} };
      }
      document.getElementById("aboutLoading").style.display = "none";
      document.getElementById("aboutContent").style.display = "block";
      renderAbout();
    }

    function getLang() {
      return localStorage.getItem("lang") || "ar";
    }

    initI18n(translations, () => {
      if (settingsData) renderAbout();
    });

    loadSettings();
  </script>

</body>
</html>
